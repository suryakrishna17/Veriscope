services:
  - type: web
    name: veriscope-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: APP_ENV
        value: prod
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "false"
      - key: CORS_ORIGINS
        value: "https://veriscope.vercel.app"
